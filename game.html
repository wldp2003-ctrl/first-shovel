<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="첫 삽 — 작업을 알면 위험이 보인다 (지예건설)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>첫 삽 — 현장 연습</title>
<script>
// 2단계 현장 연습: 기초 교육(index.html)을 마치기 전에는 잠김. 게임 저장 기록은 그대로 둔다
try { if (localStorage.getItem('cheotsap.learn.done') !== '1') location.replace('./index.html#locked'); } catch (e) {}
</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./fonts/fonts.css">
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/upgrade.css">
<link rel="stylesheet" href="./css/i18n.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <header id="topbar">
    <div class="row">
      <button class="chip money" id="moneyChip" data-i18n-title="html.money">⟦money⟧ <b id="money">0</b></button>
      <button class="chip" id="dateChip" data-i18n-title="html.forecast">⟦calendar⟧ <span id="dateTxt">-</span> <span id="wxIcon">⟦sun⟧</span> <span id="wxTemp"></span></button>
      <div class="spacer"></div>
      <button class="chip icon" id="musicBtn" data-i18n-title="html.music">⟦sound⟧</button>
      <button class="chip demo" id="demoBtn" data-i18n-title="html.demoTitle" data-i18n="html.demo" data-i18n-ko="no">⟦play⟧ 시연 모드</button>
    </div>
    <div class="row sub">
      <span class="mini" id="moraleTxt">⟦face⟧ 사기 60</span>
      <span class="mini" id="crewTxt">⟦worker⟧ 인부 0</span>
      <span class="mini" id="wxNote"></span>
      <span class="mini conflict hidden" id="conflictTag" data-i18n="html.conflict" data-i18n-ko="no">⟦warn⟧ 갈등 중 -30%</span>
    </div>
  </header>

  <section id="sitecard">
    <div class="sc-head">
      <div><span id="scFlag">🇰🇷</span> <b id="scName">강아지집</b> <span class="tag" id="scPhase">착공 전</span></div>
      <div class="dday" id="scDday">공기 2일</div>
    </div>
    <div class="phases" id="scPhases"></div>
    <div class="bars">
      <div class="barrow"><span data-i18n="html.plan" data-i18n-ko="no">계획</span><div class="bar plan"><i id="barPlan"></i></div><em id="pctPlan">0%</em></div>
      <div class="barrow"><span data-i18n="html.actual" data-i18n-ko="no">실적</span><div class="bar act"><i id="barAct"></i></div><em id="pctAct">0%</em></div>
    </div>
    <div class="warn hidden" id="scWarn">⟦warn⟧ 공정 지연</div>
    <div class="evbox hidden" id="scEvent"></div>
    <button class="lift hidden" id="liftBtn">⟦stairs⟧ 층 이동</button>
  </section>

  <section id="actions">
    <button class="btn work" id="workBtn"><span class="lbl">⟦tool⟧ 작업</span><small id="workSub">12 / 12</small></button>
    <button class="btn next" id="nextBtn"><span class="lbl">⟦moon⟧ 하루 마감</span><small id="nextSub">다음 날</small></button>
  </section>

  <nav id="nav">
    <button data-tab="shop">⟦shop⟧<span data-i18n="html.tabShop" data-i18n-ko="no">상점</span></button>
    <button data-tab="side">⟦shop⟧<span data-i18n="html.tabSide" data-i18n-ko="no">부업</span><i class="dot hidden" id="dotSide"></i></button>
    <button data-tab="quest">⟦note⟧<span data-i18n="html.tabQuest" data-i18n-ko="no">퀘스트</span><i class="dot hidden" id="dotQuest"></i></button>
    <button data-tab="together">⟦together⟧<span data-i18n="html.tabTogether" data-i18n-ko="no">함께</span><i class="cnt hidden" id="cntFriends">0</i></button>
    <button data-tab="map">⟦globe⟧<span data-i18n="html.tabMap" data-i18n-ko="no">세계지도</span></button>
  </nav>

  <div id="sheet" class="hidden">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="x" id="sheetClose">⟦cross⟧</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="intro">
    <div class="intro-top">
      <button class="chip icon" id="introMusic">⟦sound⟧</button>
    </div>
    <div class="logo-wrap">
      <div class="logo" data-ko-ok>첫 삽</div>
      <div class="logo-sub" data-i18n="html.logoSub"></div>
      <div class="slogan" data-i18n="html.slogan">작업을 알면 위험이 보인다</div>
      <div class="company" data-ko-ok>⟦ppe⟧ 지예건설</div>
    </div>
    <div class="intro-panel">
      <div class="cont hidden" id="introCont"></div>
      <div class="langpick" id="introLang"></div>
      <input id="nickInput" maxlength="10" data-i18n-ph="html.nick" placeholder="닉네임을 입력하세요" autocomplete="off">
      <button class="track field start" id="trackField"><b>⟦ppe⟧ 첫 출근 시작</b><small>건설현장이 처음인 분 · 10분 안전 코스부터</small></button>
    </div>
  </div>

  <div id="modals"></div>
  <div id="toasts"></div>
</div>
<script type="module" src="./js/gicons.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
