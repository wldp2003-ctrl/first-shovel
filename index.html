<style>
html.boot, html.boot body { background: var(--bg); margin: 0; } html.boot #app { visibility: hidden; }
#opening { position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; cursor: pointer; font-family: var(--font); }
#opening .op-name { font-size: 40px; font-weight: 800; letter-spacing: 6px; color: var(--ink); }
#opening .op-sub { font-size: 15px; color: var(--ink-2); letter-spacing: 1px; }
#opening .op-mascot { line-height: 0; }
#opening.full .lg-shovel { transform-origin: 48px 40px; animation: dig 1s cubic-bezier(.5, 0, .3, 1) both; }
#opening.full .lg-clod { animation: clod .5s .75s both; }
#opening.full .lg-ground { animation: fadein .3s both; }
#opening.full .op-name { animation: rise .35s 1.05s both; }
#opening.full .op-sub { animation: rise .35s 1.2s both; }
#opening.full .op-mascot { animation: op-wave .4s 1.25s cubic-bezier(.3, 1.4, .5, 1) both; }
#opening.short .op-mark, #opening.short .op-name, #opening.short .op-sub, #opening.short .op-mascot { animation: fadein .25s both; }
@keyframes dig { 0% { transform: rotate(-38deg) translate(26px, -40px); opacity: 0; } 35% { opacity: 1; } 60% { transform: rotate(-12deg) translate(4px, 6px); } 100% { transform: rotate(-38deg) translate(0, 0); } }
@keyframes clod { from { transform: translateY(8px) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes op-wave { from { transform: translateX(60px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
