<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b2f36">
<meta name="description" content="첫 삽 — 게임으로 시작하는 건설 입문 교육 (지예건설)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>첫 삽 — 게임으로 시작하는 건설 입문 교육</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
<link rel="stylesheet" href="./css/upgrade.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <header id="topbar">
    <div class="row">
      <button class="chip money" id="moneyChip" title="보유 금액">💰 <b id="money">0</b></button>
      <button class="chip" id="dateChip" title="5일 예보">📅 <span id="dateTxt">-</span> <span id="wxIcon">☀️</span> <span id="wxTemp"></span></button>
      <div class="spacer"></div>
      <button class="chip icon" id="musicBtn" title="음악 켜기/끄기">🎵</button>
      <button class="chip demo" id="demoBtn" title="발표용 자동 시공">▶ 시연 모드</button>
    </div>
    <div class="row sub">
      <span class="mini" id="moraleTxt">😊 사기 60</span>
      <span class="mini" id="crewTxt">👷 인부 0</span>
      <span class="mini" id="wxNote"></span>
      <span class="mini conflict hidden" id="conflictTag">⚠️ 갈등 중 -30%</span>
    </div>
  </header>

  <section id="sitecard">
    <div class="sc-head">
      <div><span id="scFlag">🇰🇷</span> <b id="scName">강아지집</b> <span class="tag" id="scPhase">착공 전</span></div>
      <div class="dday" id="scDday">공기 2일</div>
    </div>
    <div class="phases" id="scPhases"></div>
    <div class="bars">
      <div class="barrow"><span>계획</span><div class="bar plan"><i id="barPlan"></i></div><em id="pctPlan">0%</em></div>
      <div class="barrow"><span>실적</span><div class="bar act"><i id="barAct"></i></div><em id="pctAct">0%</em></div>
    </div>
    <div class="warn hidden" id="scWarn">⚠️ 공정 지연</div>
    <div class="evbox hidden" id="scEvent"></div>
    <button class="lift hidden" id="liftBtn">🪜 층 이동</button>
  </section>

  <section id="actions">
    <button class="btn work" id="workBtn"><span class="lbl">🔨 작업</span><small id="workSub">12 / 12</small></button>
    <button class="btn next" id="nextBtn"><span class="lbl">🌙 하루 마감</span><small id="nextSub">다음 날</small></button>
  </section>

  <nav id="nav">
    <button data-tab="shop">🛒<span>상점</span></button>
    <button data-tab="side">💼<span>부업</span><i class="dot hidden" id="dotSide"></i></button>
    <button data-tab="quest">📋<span>퀘스트</span><i class="dot hidden" id="dotQuest"></i></button>
    <button data-tab="together">🤝<span>함께</span><i class="cnt hidden" id="cntFriends">0</i></button>
    <button data-tab="map">🗺️<span>세계지도</span></button>
  </nav>

  <div id="sheet" class="hidden">
    <div class="sheet-head"><b id="sheetTitle"></b><button class="x" id="sheetClose">✕</button></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div id="intro">
    <div class="intro-top">
      <button class="chip icon" id="introMusic">🎵</button>
    </div>
    <div class="logo-wrap">
      <div class="logo">첫 삽</div>
      <div class="slogan">게임으로 시작하는 건설 입문 교육</div>
      <div class="company">⛑️ 지예건설</div>
    </div>
    <div class="intro-panel">
      <div class="cont hidden" id="introCont"></div>
      <input id="nickInput" maxlength="10" placeholder="닉네임을 입력하세요" autocomplete="off">
      <button class="track student" id="trackStudent"><b>🎓 학생 트랙</b><small>쌓을수록 깊어져요 · 건축기사까지</small></button>
      <button class="track field" id="trackField"><b>🦺 현장 첫 출근 트랙</b><small>10분 안전 코스 · 中文 · Tiếng Việt · Русский</small></button>
    </div>
  </div>

  <div id="modals"></div>
  <div id="toasts"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
